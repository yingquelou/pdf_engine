# cargo-deny 配置：许可证、安全公告与依赖卫生。
# 规则定义见 docs/roadmap/principles.md 工程约定 #1；登记表见 scripts/deps.allow.toml。
# 用法：cargo deny check licenses advisories bans

[graph]
# dev-dependencies 不进入运行时分发，许可证由 scripts/deps.allow.toml 人工登记
# （jpeg-encoder 含 IJG 独立许可，非 SPDX 标识，交由登记表核对）。
exclude-dev = true

[licenses]
# 允许的出站相容许可；GPL/AGPL/LGPL 与无许可证不在列表内，即被拒绝。
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]

[advisories]
yanked = "warn"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
