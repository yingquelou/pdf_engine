[package]
name = "pdf_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
# DEFLATE/zlib 解码：PDF 的 FlateDecode 过滤器（XRef 流 / 对象流等）必需。
# 仅启用纯 Rust 的 miniz_oxide 后端（rust_backend），不引入 C 版 zlib。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
md-5 = "0.10"
# SHA-1/SHA-256 摘要：数字签名（12.8）ByteRange 覆盖字段的摘要计算。
# 与 md-5 同属 RustCrypto digest 0.10 家族，经 `SignatureBackend` trait 隔离。
sha1 = "0.10"
sha2 = "0.10"
rc4 = "0.1"
subtle = "2"
zeroize = "1"
# JPEG 解码：PDF 的 DCTDecode 过滤器（zune-jpeg）及其基础类型
# ZCursor / ColorSpace（zune-core），两者为配套的 0.5 系列。
zune-core = "0.5"
zune-jpeg = "0.5.15"
# CFF/OpenType 字体轮廓解析：PDF 的 CIDFontType0 与 FontFile3 CFF 程序。
# 经 `CffOutlineBackend` trait 适配器隔离，避免直接依赖第三方 API。
ttf-parser = "0.25"

[lib]
name = "pdf_engine"
path = "src/lib.rs"
crate-type = ["cdylib","lib"]

[[bin]]
name = "demo"
path = "src/main.rs"

[dev-dependencies]
jpeg-encoder = "0.7.1"
