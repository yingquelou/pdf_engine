[package]
name = "pdf_engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yingquelou/pdf_engine"
# 出站双许可：见 LICENSE-MIT / LICENSE-APACHE。
# rust-version 是实测值而非门槛设定：项目自身代码最高用到 `slice::as_chunks`
# （1.88 稳定，如 src/core/builder/types/function.rs、src/core/reader/image/model.rs），
# 非 dev 依赖的最高声明值是 zeroize 1.85；取两者较大值即 1.88。
# 此前的 1.85 与代码实际不符，这里是把假声明纠正为真实值，不是抬高门槛。
rust-version = "1.88"

[dependencies]
aes = "0.8"
# DEFLATE/zlib 解码：PDF 的 FlateDecode 过滤器（XRef 流 / 对象流等）必需。
# 仅启用纯 Rust 的 miniz_oxide 后端（rust_backend），不引入 C 版 zlib。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
md-5 = "0.10"
# SHA-1/SHA-256 摘要：数字签名（12.8）ByteRange 覆盖字段的摘要计算。
# 与 md-5 同属 RustCrypto digest 0.10 家族，经 `SignatureBackend` trait 隔离。
sha1 = "0.10"
sha2 = "0.10"
rc4 = "0.1"
subtle = "2"
zeroize = "1"
# JPEG 解码：PDF 的 DCTDecode 过滤器（zune-jpeg）及其基础类型
# ZCursor / ColorSpace（zune-core），两者为配套的 0.5 系列。
zune-core = "0.5"
zune-jpeg = "0.5.15"
# CFF/OpenType 字体轮廓解析：PDF 的 CIDFontType0 与 FontFile3 CFF 程序。
# 经 `CffOutlineParser` trait 适配器隔离，避免直接依赖第三方 API。
ttf-parser = "0.25"
# LZW 位流与字典解码：PDF 的 LZWDecode 过滤器（7.4.4）。
# 仅启用纯 Rust 的 alloc 后端，经 `filters/lzw_backend.rs` 适配器隔离。
weezl = { version = "0.1.12", default-features = false, features = ["alloc"] }
# CCITT Group 3/4 位流与行解码：PDF 的 CCITTFaxDecode 过滤器（7.4.6）。
# 纯安全 Rust（crate 内 forbid(unsafe_code)），经 `ccitt/backend.rs` 适配器隔离。
hayro-ccitt = "0.3.0"
# JBIG2 位图解码：PDF 的 JBIG2Decode 过滤器（7.4.7）。
# 纯安全 Rust（crate 内 forbid(unsafe_code)），经 `image/backend/jbig2_hayro.rs`
# 适配器隔离；仅开 std，不引入 image / simd 特性（后者抬高依赖面与 MSRV）。
hayro-jbig2 = { version = "0.3.0", default-features = false, features = ["std"] }
# JPEG 2000 位图解码：PDF 的 JPXDecode 过滤器（7.4.9）。
# 同上：经 `image/backend/jpx_hayro.rs` 适配器隔离；不引入 image/moxcms（ICC
# 剖面字节交给项目自己的颜色管线）与 simd 特性。
hayro-jpeg2000 = { version = "0.3.5", default-features = false, features = ["std"] }

[lib]
name = "pdf_engine"
path = "src/lib.rs"
crate-type = ["cdylib","lib"]

[[bin]]
name = "demo"
path = "src/main.rs"

[dev-dependencies]
jpeg-encoder = "0.7.1"

# 阶段 E/F 交互集成测试按特性分文件（`tests/interactive/`），因此目标根不是
# `tests/*.rs` 自动发现的文件，需显式声明路径。
[[test]]
name = "interactive"
path = "tests/interactive/mod.rs"

# 基础往返/API 契约集成测试按主题分文件（`tests/main/`），同上需显式声明路径。
[[test]]
name = "main"
path = "tests/main/mod.rs"

# 第 7 章语法与文件结构集成测试按主题分文件（`tests/syntax/`），同上需显式声明路径。
[[test]]
name = "syntax"
path = "tests/syntax/mod.rs"
