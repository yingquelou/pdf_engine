# 依赖登记表（机器可读事实源）
# 规则解释见 docs/roadmap/principles.md 工程约定 #1；人类可读索引见 docs/third-party/README.md。
# 本文件只登记易变元数据（版本、复核日期、豁免理由、适配器位置、行为差异与退化判定），由 scripts/deps_check.ps1 校验。

[meta]
outbound_license = "MIT OR Apache-2.0"
review_interval_days = 365

# role:
#   capability  提供编解码/解析/密码学能力，只能出现在 adapter 或 test_paths 内
#   hygiene     只提供安全属性，全域允许
#   data        vendored 纯数据，不参与 manifest 对账
#   dev         仅 [dev-dependencies]，禁止进入 src
# maintenance:
#   active          按 review_interval_days 复核发布节奏
#   frozen-format   格式冻结型，只要求无未修复安全公告
#   vendored        数据型，只要求溯源与许可证
# behaviour_delta  与本地实现或替换前实现相比的已知行为差异（无差异写「无」）；D8 必填
# degraded         是否相对现状退化；true 时须另登记 degradations、degradation_acceptance 与 degradation_tests

[[dep]]
name = "aes"
lib = "aes"
role = "capability"
version = "0.8.4"
spdx = "MIT OR Apache-2.0"
maintenance = "active"
reviewed = "2026-11-06"
adapter = ["src/core/reader/security/crypto.rs"]
test_paths = ["src/core/reader/security/standard/tests/mod.rs"]
behaviour_delta = "无；仅 AES-128-CBC 原语，分组模式、填充与密钥派生仍在本地实现"
degraded = false
justification = "AES-128-CBC 原语（标准安全处理器 7.6.2/7.6.3）；密钥派生与权限位在本地实现。"

